# PRODUCAO — stack ct-portas-abertas na VM. O Portainer puxa este arquivo do
# repo (branch main) e, com force-pull no auto-update, aplica a imagem :latest
# nova sozinho a cada build. Site 100% estatico servido por nginx (sem backend).
services:
  ct-portas-abertas:
    image: ghcr.io/pet-eng-comp-org/ct-portas-abertas@sha256:0c84d7a435f3e0216867e1f09fcdd3b70c7eb6a715f136213f231e21daed7727
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: ct-portas-abertas
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ct-portas-abertas.rule=Host(`ctportasabertas.pet.inf.ufes.br`)"
      - "traefik.http.services.ct-portas-abertas.loadbalancer.server.port=80"
      - "traefik.http.routers.ct-portas-abertas.entrypoints=websecure"
      - "traefik.http.routers.ct-portas-abertas.tls.certresolver=le"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
networks:
  traefik:
    name: traefik
